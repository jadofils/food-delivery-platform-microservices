spring.application.name=identity-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/identity_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

# open-in-view=false on purpose: the default (true) keeps a DB connection held open for the
# whole request just so lazy associations *could* be touched from the view layer, and masks
# lazy-loading mistakes instead of failing fast where they happen. Every query this service
# needs is fetched explicitly in the repository/service layer (see UserRepository's
# @EntityGraph), never lazily from a controller.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
