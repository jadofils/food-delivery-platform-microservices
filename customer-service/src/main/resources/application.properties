spring.application.name=customer-service
server.port=8082

# Postgres, customer_db -- this service's own schema exclusively (RULES.md Sec5). Credentials
# match docker-compose.yml's local-dev defaults (.env.example); never hardcoded for anything
# beyond local dev.
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

# Flyway owns the schema; Hibernate only validates it matches what the entities expect, never
# generates/alters DDL itself (RULES.md Sec1 factor 12, Sec5).
spring.jpa.hibernate.ddl-auto=validate
# No lazy-loading-outside-a-transaction safety net from an open Hibernate session per request --
# forces every fetch to be explicit (RULES.md -- "no unnecessary eager loading").
spring.jpa.open-in-view=false

# Direct JWKS endpoint, not issuer-uri -- see SecurityConfig's comment on jwtDecoder() for why
# (avoids an eager OIDC-discovery call at context startup).
fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health
