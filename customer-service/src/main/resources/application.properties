spring.application.name=customer-service
# 0 = OS-assigned free port, not a fixed one -- this service is reached exclusively through
# api-gateway's Eureka-resolved lb://customer-service routing (or another service's own Feign
# client, same mechanism), never a hardcoded address. Lets more than one instance run on the same
# host for real horizontal scaling (RULES.md Sec1 factor 8) without a port clash.
server.port=0
# Without this, two instances on the same host silently collide: Eureka's default instance-id
# template is hostname:app-name:${server.port}, and that placeholder resolves to the literal
# string "0" (server.port's own config value), not whatever port gets bound at runtime -- both
# instances register under the identical id "...customer-service:0", and the second registration
# just overwrites the first's entry instead of adding a second one. Confirmed live: two instances
# started side by side showed as exactly one Eureka entry, carrying only the second instance's
# port, until this was added. random.value is resolved once per JVM at property-loading time
# (before server.port is even relevant), giving every instance a genuinely distinct id.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Postgres, customer_db -- this service's own schema exclusively (RULES.md Sec5). Credentials
# match docker-compose.yml's local-dev defaults (.env.example); never hardcoded for anything
# beyond local dev.
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

# Flyway owns the schema; Hibernate only validates it matches what the entities expect, never
# generates/alters DDL itself (RULES.md Sec1 factor 12, Sec5).
spring.jpa.hibernate.ddl-auto=validate
# No lazy-loading-outside-a-transaction safety net from an open Hibernate session per request --
# forces every fetch to be explicit (RULES.md -- "no unnecessary eager loading").
spring.jpa.open-in-view=false

# Direct JWKS endpoint, not issuer-uri -- see SecurityConfig's comment on jwtDecoder() for why
# (avoids an eager OIDC-discovery call at context startup).
fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register by IP, not hostname -- api-gateway (Reactor Netty) resolves lb:// targets via async DNS,
# which (unlike the blocking java.net resolution Feign/RestClient use elsewhere in this codebase)
# does not consult the OS's own NetBIOS/hosts resolution. On a Docker Desktop/WSL2 host, Eureka's
# default hostname-based registration advertises a *.mshome.net name that only the OS-level
# resolver can resolve -- confirmed live: api-gateway's first routed request failed with
# UnknownHostException until this was set. IP-based registration is also the more portable choice
# generally (a container/VM hostname is not guaranteed resolvable outside it).
eureka.instance.prefer-ip-address=true

# Distributed tracing (RULES.md Sec13). 1.0 (trace every request) is a deliberate local-dev-only
# choice -- a production deployment would sample a fraction, not every request, to bound Zipkin's
# storage/ingestion load.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
# Structured JSON to stdout (RULES.md Sec1 factor 11 -- "never opens a log file and never pushes
# logs over the network itself"; shipping stdout to Elasticsearch is Logstash's job, not this
# service's own). Elastic Common Schema is the schema the planned Sec13 log stack
# (Elasticsearch/Logstash/Kibana) is built around. Every log line emitted while a trace is active
# carries flat traceId/spanId fields automatically (Micrometer Tracing's MDC bridge) -- verified
# live: the exact same id shows up here, in Zipkin, and in the traceId field of any error response
# (Sec13's "one correlation ID, three places").
logging.structured.format.console=ecs

# "Upper level" (root) logging stays at INFO so framework startup noise doesn't drown out this
# service's own log lines; this service's own code (and common's shared code, under the same
# food_delivery.Platform prefix) gets DEBUG for local-dev visibility. Hibernate's SQL/bind logging
# is genuinely useful additional information for local debugging -- never enable orm.jdbc.bind at
# TRACE in production, it logs bound parameter values verbatim, which for this service means raw
# (unmasked) phone numbers/emails before the @Masked serializer ever sees them.
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator: info/loggers alongside health so a running instance is diagnosable without attaching a
# debugger (RULES.md Sec13). /actuator/info surfaces build/app metadata; /actuator/loggers reads
# AND changes (POST) a package's log level at runtime, no restart needed.
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=FDP customer profiles and delivery addresses
