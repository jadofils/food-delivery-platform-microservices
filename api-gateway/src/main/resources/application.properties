spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register by IP, not hostname -- see customer-service's application.properties for the full
# reasoning (discovered via this module's own first routed request, an UnknownHostException on a
# Docker Desktop/WSL2 host's *.mshome.net self-registration name). Nothing calls api-gateway via
# lb:// today, but there's no reason for it to be the one service left inconsistent.
eureka.instance.prefer-ip-address=true

fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

# Redis -- rate-limit counters only (RULES.md Sec12), never a system of record for this service
# (docs/services/api-gateway.md). Namespaced key ("gateway:rate-limit:{clientId}") comes from
# RateLimiterConfig's own KeyResolver, not from anything set here.
spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:fdp}

# ---------------------------------------------------------------------------------------------
# Routing (RULES.md Sec2, Sec6; SPRINTS.md Sprint 4 customers/restaurants/orders, Sprint 5 adds
# deliveries -- added here retroactively now that api-gateway itself finally exists).
# ---------------------------------------------------------------------------------------------
# Every uri below is lb://<service-name>, resolved through Eureka -- never a hardcoded host
# (RULES.md Sec6). Route order matters: first match wins. order-placement is listed before the
# general order-service catch-all, or a POST to /api/orders/me would match the broad
# /api/orders/** route first and skip the RequestRateLimiter filter below entirely.
spring.cloud.gateway.server.webflux.routes[0].id=order-placement
spring.cloud.gateway.server.webflux.routes[0].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/me
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@rateLimitKeyResolver}

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[2].id=customer-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webflux.routes[3].id=restaurant-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://restaurant-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/restaurants/**

spring.cloud.gateway.server.webflux.routes[4].id=delivery-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://delivery-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/deliveries/**

# Not part of the original Sprint 4/5 route table (RULES.md/SPRINTS.md never specified one) --
# added once every domain service moved to a dynamic port (server.port=0): without this,
# notification-service would have no stable address left at all, direct or otherwise.
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**

# Rate limiting (RULES.md Sec12, SPRINTS.md Sprint 4) -- RedisRateLimiter is auto-configured as the
# default RateLimiter implementation once a reactive Redis connection factory is on the classpath
# (spring-boot-starter-data-redis, above), so the filter itself only needs to name a KeyResolver;
# these per-route-id overrides (keyed by the "order-placement" route's own id, matched by
# RedisRateLimiter against whatever route id it's invoked for) are what actually set the bucket
# size. 5 requests/sec sustained, burst up to 10, 1 token per request -- generous enough not to
# trip during ordinary manual testing, tight enough to demonstrate a real 429 under a quick burst.
spring.cloud.gateway.server.webflux.redis-rate-limiter.config.order-placement.replenish-rate=5
spring.cloud.gateway.server.webflux.redis-rate-limiter.config.order-placement.burst-capacity=10
spring.cloud.gateway.server.webflux.redis-rate-limiter.config.order-placement.requested-tokens=1

# Actuator: health only for now (RULES.md Sec13's fuller diagnostics story -- info/loggers,
# structured logging correlation -- hasn't reached this module yet; see docs/services/api-gateway.md).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
# Gateway's own route-matching/filter-chain decisions -- genuinely useful when a route doesn't
# match the way you expect, and otherwise invisible.
logging.level.org.springframework.cloud.gateway=DEBUG
