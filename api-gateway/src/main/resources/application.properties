spring.application.name=api-gateway

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
# Structured JSON to stdout (RULES.md Sec1 factor 11). No actuator dependency in this module today
# (still a skeleton -- boots, no routes yet), so no /actuator/info or /actuator/loggers here --
# add spring-boot-starter-actuator first if that visibility is ever needed.
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
