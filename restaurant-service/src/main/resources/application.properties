spring.application.name=restaurant-service
server.port=8083

# Postgres, restaurant_db -- this service's own schema exclusively (RULES.md Sec5).
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Direct JWKS endpoint, not issuer-uri -- see SecurityConfig's comment on jwtDecoder() for why.
fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health

# Distributed tracing (RULES.md Sec13). 1.0 (trace every request) is a deliberate local-dev-only
# choice -- a production deployment would sample a fraction, not every request.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Distributed caching (RULES.md Sec12) -- credentials match docker-compose.yml's redis service
# (--requirepass), same local-dev-defaults pattern as every other datastore in this file. Port
# 6380, not Redis's usual 6379: this machine already had an unrelated Redis instance bound to
# 6379, so fdp-redis publishes on 6380 instead (see the repo-root .env, REDIS_PORT) -- keep this
# value in sync with that if it ever changes.
spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:fdp}
