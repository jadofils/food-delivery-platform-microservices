spring.application.name=restaurant-service
server.port=8083

# Postgres, restaurant_db -- this service's own schema exclusively (RULES.md Sec5).
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Direct JWKS endpoint, not issuer-uri -- see SecurityConfig's comment on jwtDecoder() for why.
fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register by IP, not hostname -- see customer-service's application.properties for the full
# api-gateway/Reactor-Netty-DNS reasoning; same fix, every service that api-gateway routes to needs it.
eureka.instance.prefer-ip-address=true

# Distributed tracing (RULES.md Sec13). 1.0 (trace every request) is a deliberate local-dev-only
# choice -- a production deployment would sample a fraction, not every request.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
# Structured JSON to stdout (RULES.md Sec1 factor 11). Elastic Common Schema is the schema the
# planned Sec13 log stack (Elasticsearch/Logstash/Kibana) is built around. Every log line emitted
# while a trace is active carries flat traceId/spanId fields automatically (Micrometer Tracing's
# MDC bridge) -- verified live: the exact same id shows up here, in Zipkin, and in the traceId
# field of any error response (Sec13's "one correlation ID, three places").
logging.structured.format.console=ecs

# "Upper level" (root) logging stays at INFO so framework startup noise doesn't drown out this
# service's own log lines; this service's own code (and common's shared code) gets DEBUG for
# local-dev visibility.
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator: info/loggers alongside health so a running instance is diagnosable without attaching a
# debugger. /actuator/info surfaces build/app metadata; /actuator/loggers reads AND changes (POST)
# a package's log level at runtime, no restart needed.
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=FDP restaurants, menus, and menu items

# Distributed caching (RULES.md Sec12) -- credentials match docker-compose.yml's redis service
# (--requirepass), same local-dev-defaults pattern as every other datastore in this file. Port
# 6380, not Redis's usual 6379: this machine already had an unrelated Redis instance bound to
# 6379, so fdp-redis publishes on 6380 instead (see the repo-root .env, REDIS_PORT) -- keep this
# value in sync with that if it ever changes.
spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:fdp}
