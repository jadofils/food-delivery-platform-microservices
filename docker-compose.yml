# Sprint 0 scope only (RULES.md §10, SPRINTS.md Sprint 0): the four backing infra containers —
# Postgres, MongoDB, RabbitMQ, Redis. No FDP service is defined here yet; each service joins this
# file in the sprint that actually needs it, and the full compose file (all nine services +
# Zipkin/ELK/Prometheus/Grafana) is finalized in Sprint 7.
#
# Credentials below are local-development defaults only — override any of them via a repo-root
# .env file (gitignored; see .env.example for the full list). Never put real credentials in this
# file itself.

networks:
  fdp-network:
    name: fdp-network

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
  redis-data:

services:

  postgres:
    image: postgres:17-alpine
    container_name: fdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdp}
      POSTGRES_DB: ${POSTGRES_DB:-fdp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdp} -d ${POSTGRES_DB:-fdp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  mongodb:
    image: mongo:7
    container_name: fdp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-fdp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-fdp}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fdp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fdp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fdp}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  redis:
    image: redis:7-alpine
    container_name: fdp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-fdp}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fdp}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network
