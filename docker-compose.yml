# Sprint 0 (RULES.md §10, SPRINTS.md Sprint 0) added the four backing infra containers —
# Postgres, MongoDB, RabbitMQ, Redis; Sprint 1 added Keycloak, the identity provider. No FDP
# service is defined here yet; each joins this file in the sprint that actually needs it (see
# RUNNING.md for how each currently runs instead — Maven, not Docker), and the full compose file
# (all eight services + Zipkin/ELK/Prometheus/Grafana) is finalized in Sprint 7.
#
# Every container below follows one naming convention: container_name "fdp-<name>", a pinned
# version tag (never "latest") — see RUNNING.md's "Naming & tagging" section.
#
# Credentials below are local-development defaults only — override any of them via a repo-root
# .env file (gitignored; see .env.example for the full list). Never put real credentials in this
# file itself.

networks:
  fdp-network:
    name: fdp-network

volumes:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
  redis-data:

services:

  postgres:
    image: postgres:17-alpine
    container_name: fdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdp}
      POSTGRES_DB: ${POSTGRES_DB:-fdp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdp} -d ${POSTGRES_DB:-fdp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  mongodb:
    image: mongo:7
    container_name: fdp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-fdp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-fdp}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fdp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fdp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fdp}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  redis:
    image: redis:7-alpine
    container_name: fdp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-fdp}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fdp}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fdp-network

  # The identity provider (RULES.md §8): owns users, credentials, login, and issues the JWTs
  # every other service validates as an OAuth2 Resource Server. "fdp" realm + "fdp-api" client +
  # baseline client roles + one demo user per role are provisioned automatically on first start
  # from docker/keycloak/fdp-realm.json — see credentials.md for the demo accounts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fdp-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-fdp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-fdp}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/fdp-realm.json:/opt/keycloak/data/import/fdp-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fdp-network
