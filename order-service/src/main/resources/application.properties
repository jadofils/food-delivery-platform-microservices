spring.application.name=order-service
server.port=8084

# Postgres, order_db -- this service's own schema exclusively (RULES.md Sec5).
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# RabbitMQ -- local dev defaults, matching docker-compose.yml's fdp/fdp (RULES.md Sec1 factor 3).
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:fdp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:fdp}

# Feign timeouts -- the "timeout" leg of RULES.md Sec7's circuit-breaker/retry/timeout/bulkhead
# quartet, enforced at the HTTP client itself rather than via Resilience4j's @TimeLimiter (see
# CustomerServiceGateway's class comment for why).
feign.client.config.customer-service.connect-timeout=2000
feign.client.config.customer-service.read-timeout=3000
feign.client.config.restaurant-service.connect-timeout=2000
feign.client.config.restaurant-service.read-timeout=3000

# Resilience4j -- explicit per-instance config for both downstream clients, never relying on
# library defaults (RULES.md Sec7). ResourceNotFoundException is ignored: a 404 from a
# downstream service (customer/address/restaurant/menu-item not found) is a legitimate business
# outcome, not evidence the dependency itself is unhealthy -- it must never trip the breaker or
# divert into the ServiceUnavailableException fallback.
resilience4j.circuitbreaker.instances.customer-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.customer-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customer-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customer-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.customer-service.ignore-exceptions=food_delivery.Platform.common.error.ResourceNotFoundException

resilience4j.circuitbreaker.instances.restaurant-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.restaurant-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.restaurant-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.restaurant-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.restaurant-service.ignore-exceptions=food_delivery.Platform.common.error.ResourceNotFoundException

resilience4j.retry.instances.customer-service.max-attempts=3
resilience4j.retry.instances.customer-service.wait-duration=300ms
resilience4j.retry.instances.customer-service.ignore-exceptions=food_delivery.Platform.common.error.ResourceNotFoundException

resilience4j.retry.instances.restaurant-service.max-attempts=3
resilience4j.retry.instances.restaurant-service.wait-duration=300ms
resilience4j.retry.instances.restaurant-service.ignore-exceptions=food_delivery.Platform.common.error.ResourceNotFoundException

resilience4j.bulkhead.instances.customer-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.restaurant-service.max-concurrent-calls=10

management.endpoints.web.exposure.include=health,circuitbreakers
