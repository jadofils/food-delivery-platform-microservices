spring.application.name=notification-service
server.port=8086

# MongoDB, notification_db -- this service's own collection exclusively (RULES.md Sec5). The root
# user is created in the "admin" auth database by docker-compose's MONGO_INITDB_ROOT_* env vars,
# so authSource=admin is required to authenticate here even though the target database is
# notification_db, not admin.
spring.data.mongodb.uri=mongodb://${MONGO_ROOT_USERNAME:fdp}:${MONGO_ROOT_PASSWORD:fdp}@localhost:27017/notification_db?authSource=admin
# Off by default in modern Spring Data MongoDB -- without this, @Indexed(unique = true) on
# NotificationRecord.eventId is never actually enforced by MongoDB itself, and idempotent
# consumption (RULES.md Sec6, Sec1 factor 9) would rest entirely on a find-then-save check in
# application code, which is not atomic and can still let a duplicate through under a close-enough
# redelivery race (caught by this service's own integration test).
spring.data.mongodb.auto-index-creation=true

fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:fdp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:fdp}

# A few retries before a message is dead-lettered (RabbitConfig's queue x-dead-letter-exchange
# arg) -- without this, Spring AMQP's default is to requeue-and-retry a failing message forever,
# which would never actually reach the DLQ (RULES.md Sec6).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms

# Distributed tracing (RULES.md Sec13). observation-enabled makes each consumed message continue
# the trace order-service's publish started, rather than beginning a disconnected new one --
# verified via micrometer-tracing-bridge-brave's context propagation (JAR-inspected: the property
# is RabbitProperties.SimpleContainer.observationEnabled, not enabled by spring-boot-starter-amqp
# alone).
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.rabbitmq.listener.simple.observation-enabled=true

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
# Structured JSON to stdout (RULES.md Sec1 factor 11). Elastic Common Schema is the schema the
# planned Sec13 log stack (Elasticsearch/Logstash/Kibana) is built around. Every log line emitted
# while a trace is active carries flat traceId/spanId fields automatically (Micrometer Tracing's
# MDC bridge) -- verified live (customer-service): the exact same id shows up here, in Zipkin, and
# in the traceId field of any error response (Sec13's "one correlation ID, three places").
logging.structured.format.console=ecs

# "Upper level" (root) logging stays at INFO so framework startup noise doesn't drown out this
# service's own log lines; this service's own code (and common's shared code) gets DEBUG for
# local-dev visibility. No Hibernate/SQL lines here -- this is the one service with no JPA
# (MongoDB, not Postgres).
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG

# Actuator: info/loggers alongside health so a running instance is diagnosable without attaching a
# debugger. /actuator/info surfaces build/app metadata; /actuator/loggers reads AND changes (POST)
# a package's log level at runtime, no restart needed.
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=FDP notification/audit log, consumes domain events
