spring.application.name=config-server
server.port=8888

# Native (filesystem-backed) config repo, bundled into this service's own jar under
# config-repo/ -- simpler than a separate git repo for a monorepo (RULES.md Sec 4's "don't
# over-engineer ahead of need"). Every client-service .yml here is genuinely shared cross-cutting
# config, not domain data -- see config-repo/application.yml.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo
