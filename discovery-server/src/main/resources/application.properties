spring.application.name=discovery-server
server.port=8761

# Standalone mode: this instance IS the registry, so it doesn't register with itself or try to
# fetch a registry from a peer (RULES.md §2 -- no datastore, no peer-replication story yet).
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
# Structured JSON to stdout (RULES.md Sec1 factor 11). No actuator dependency in this module today
# (spring-boot-starter/spring-boot-starter-web only), so no /actuator/info or /actuator/loggers
# here -- add spring-boot-starter-actuator first if that visibility is ever needed.
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
