spring.application.name=delivery-service
# 0 = OS-assigned free port -- see customer-service's application.properties for the full
# dynamic-port/horizontal-scaling reasoning; same policy, every domain service now follows it.
server.port=0
# See customer-service's application.properties for why this is required, not optional, once
# server.port=0: without a distinct instance-id, two instances on the same host collide in Eureka.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Postgres, delivery_db -- this service's own schema exclusively (RULES.md Sec5).
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=${POSTGRES_USER:fdp}
spring.datasource.password=${POSTGRES_PASSWORD:fdp}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

fdp.security.jwk-set-uri=http://localhost:8180/realms/fdp/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register by IP, not hostname -- see customer-service's application.properties for the full
# api-gateway/Reactor-Netty-DNS reasoning; same fix, every service that api-gateway routes to needs it.
eureka.instance.prefer-ip-address=true

# RabbitMQ -- local dev defaults, matching docker-compose.yml's fdp/fdp (RULES.md Sec1 factor 3).
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:fdp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:fdp}

# A few retries before a message is dead-lettered (RabbitConfig's queue x-dead-letter-exchange
# arg) -- without this, Spring AMQP's default is to requeue-and-retry a failing message forever,
# which would never actually reach the DLQ (RULES.md Sec6).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms

# Distributed tracing (RULES.md Sec13). observation-enabled on both sides -- this service is both a
# consumer (order events) and a publisher (delivery events) -- verified via micrometer-tracing-
# bridge-brave's context propagation (JAR-inspected on order-service/notification-service first: the
# properties are RabbitProperties.SimpleContainer.observationEnabled and
# RabbitProperties.Template.observationEnabled, not enabled by spring-boot-starter-amqp alone).
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.template.observation-enabled=true

# ---------------------------------------------------------------------------------------------
# Logging & diagnostics
# ---------------------------------------------------------------------------------------------
# Structured JSON to stdout (RULES.md Sec1 factor 11). Elastic Common Schema is the schema the
# planned Sec13 log stack (Elasticsearch/Logstash/Kibana) is built around. Every log line emitted
# while a trace is active carries flat traceId/spanId fields automatically (Micrometer Tracing's
# MDC bridge) -- verified live (customer-service): the exact same id shows up here, in Zipkin, and
# in the traceId field of any error response (Sec13's "one correlation ID, three places").
logging.structured.format.console=ecs

# "Upper level" (root) logging stays at INFO so framework startup noise doesn't drown out this
# service's own log lines; this service's own code (and common's shared code) gets DEBUG for
# local-dev visibility.
logging.level.root=INFO
logging.level.food_delivery.Platform=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator: info/loggers alongside health so a running instance is diagnosable without attaching a
# debugger. /actuator/info surfaces build/app metadata; /actuator/loggers reads AND changes (POST)
# a package's log level at runtime, no restart needed.
management.endpoints.web.exposure.include=health,info,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=FDP delivery assignment and tracking
